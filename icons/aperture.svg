<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aperture">
  <title>Aperture</title>
  <defs>
    <clipPath id="aperture-circle-clip">
      <circle cx="32" cy="32" r="22"/>
    </clipPath>
  </defs>

  <!-- Blade strokes are clipped to the circle, so they can meet the rim
       naturally without sticking through it. Butt caps make every inner
       blade terminate exactly on the next blade's centerline. -->
  <g clip-path="url(#aperture-circle-clip)"
     fill="none"
     stroke="currentColor"
     stroke-width="1.55"
     stroke-linecap="butt"
     stroke-linejoin="miter">
    <path d="M 11.708 23.500 L 36.907 23.500"/> <path d="M 29.215 10.177 L 41.815 32.000"/> <path d="M 49.507 18.677 L 36.907 40.500"/> <path d="M 52.292 40.500 L 27.093 40.500"/> <path d="M 34.785 53.823 L 22.185 32.000"/> <path d="M 14.493 45.323 L 27.093 23.500"/>
  </g>

  <!-- Draw the rim last so every outer blade/rim junction is clean. -->
  <circle cx="32" cy="32" r="22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.55"/>
</svg>
